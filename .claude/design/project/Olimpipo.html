<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Pipo Cuida — Olimpipo</title>
  <link rel="stylesheet" href="colors_and_type.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #FFFFFF; font-family: var(--font-body); color: #000; }
    #root { min-height: 100%; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #E2E1DF; border-radius: 10px; }
    .pipo-serif-italic { font-family: var(--font-display); font-style: italic; font-weight: 400; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="OlimpipoScreens.jsx"></script>

<script type="text/babel">
const { useState } = React;

const App = () => {
  // Routes: 'home' | 'olimpipo' | 'olimpipo-ranking' | 'olimpipo-activities'
  const [route, setRoute] = useState('home');
  const [edition, setEdition] = useState(null);
  const user = 'Ana Silva';

  const goHome = () => { setRoute('home'); setEdition(null); };

  const navigate = (target) => {
    if (target === 'olimpipo') setRoute('olimpipo');
    else setRoute('home'); // other home links are placeholders in this prototype
  };

  let screen;
  let backLabel = null;
  let backTo = null;

  if (route === 'home') {
    screen = <HomeScreen user={user} onNavigate={navigate} />;
  } else if (route === 'olimpipo') {
    screen = (
      <OlimpipoEditionsScreen
        onOpenEdition={(ed) => { setEdition(ed); setRoute('olimpipo-ranking'); }}
      />
    );
    backLabel = '← Voltar ao início';
    backTo = goHome;
  } else if (route === 'olimpipo-ranking' && edition) {
    screen = (
      <OlimpipoRankingScreen
        edition={edition}
        onBack={() => setRoute('olimpipo')}
        onOpenActivities={() => setRoute('olimpipo-activities')}
      />
    );
    backLabel = '← Voltar às edições';
    backTo = () => setRoute('olimpipo');
  } else if (route === 'olimpipo-activities' && edition) {
    screen = (
      <OlimpipoActivitiesScreen edition={edition} />
    );
    backLabel = '← Voltar à classificação';
    backTo = () => setRoute('olimpipo-ranking');
  }

  return (
    <div style={{ minHeight: '100vh', background: '#FFFFFF', display: 'flex', flexDirection: 'column' }}>
      <TopBar onNavigate={navigate} />
      <main style={{ flex: 1 }}>
        {backLabel && (
          <div style={{ maxWidth: 520, margin: '20px auto 0', padding: '0 24px' }}>
            <button onClick={backTo} style={{
              background: 'transparent', border: 'none', cursor: 'pointer',
              font: '400 14px/20px var(--font-body)', color: '#000',
              textDecoration: 'underline', textUnderlineOffset: 3, padding: 0,
            }}>{backLabel}</button>
          </div>
        )}
        {screen}
      </main>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
