<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipo Cuida — Agent Mock</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #e5ddd5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .phone {
      width: 390px;
      height: 780px;
      background: #fff;
      border-radius: 40px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 64px rgba(0,0,0,0.25);
    }

    .header {
      background: #075e54;
      color: #fff;
      padding: 16px 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 38px; height: 38px;
      background: #128c7e;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .header-name { font-size: 16px; font-weight: 600; }
    .header-sub  { font-size: 12px; opacity: 0.8; }

    .id-bar {
      background: #f0f0f0;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #555;
      flex-shrink: 0;
      border-bottom: 1px solid #ddd;
    }

    .id-bar label { white-space: nowrap; font-weight: 500; }

    .id-input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 13px;
      outline: none;
      color: #111;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #e5ddd5;
    }

    .bubble {
      max-width: 78%;
      padding: 8px 12px 6px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      position: relative;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble.user {
      background: #dcf8c6;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .bubble.agent {
      background: #fff;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
      box-shadow: 0 1px 1px rgba(0,0,0,0.08);
    }

    .bubble a { color: #128c7e; word-break: break-all; }

    .bubble-time {
      font-size: 10px;
      color: #999;
      text-align: right;
      margin-top: 2px;
    }

    .input-bar {
      background: #f0f0f0;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      border-top: 1px solid #ddd;
    }

    .msg-input {
      flex: 1;
      background: #fff;
      border: none;
      border-radius: 20px;
      padding: 9px 14px;
      font-size: 14px;
      outline: none;
      resize: none;
      max-height: 80px;
    }

    .send-btn {
      width: 40px; height: 40px;
      background: #075e54;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 120ms;
    }

    .send-btn:hover { background: #128c7e; }
    .send-btn svg { fill: #fff; width: 20px; height: 20px; }

    .typing {
      display: none;
      align-self: flex-start;
      background: #fff;
      border-radius: 8px;
      border-bottom-left-radius: 2px;
      padding: 10px 14px;
      box-shadow: 0 1px 1px rgba(0,0,0,0.08);
    }

    .typing-dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #aaa;
      margin: 0 2px;
      animation: bounce 1.2s infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-5px); }
    }

    em { font-style: italic; }
    strong { font-weight: 600; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="header">
      <div class="header-top">
        <div class="avatar">🐧</div>
        <div>
          <div class="header-name">Pipo Cuida</div>
          <div class="header-sub">online</div>
        </div>
      </div>
    </div>

    <div class="id-bar">
      <label for="pid">Participante:</label>
      <input class="id-input" id="pid" type="text" placeholder="ex: lara.clink" value="" />
    </div>

    <div class="messages" id="messages">
      <div class="bubble agent">
        Olá! 👋 Sou o agente do Pipo Cuida.<br><br>
        Posso te ajudar a conectar sua conta do Strava ao Olimpipo.
        Tente enviar: <em>conectar strava</em>
        <div class="bubble-time">agora</div>
      </div>
    </div>

    <div class="typing" id="typing">
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
    </div>

    <div class="input-bar">
      <textarea class="msg-input" id="msg" rows="1" placeholder="Mensagem"></textarea>
      <button class="send-btn" id="send" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const typingEl   = document.getElementById('typing');
    const msgEl      = document.getElementById('msg');
    const pidEl      = document.getElementById('pid');

    let lastCount = 1;
    let polling   = null;

    msgEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    function participantId() {
      return pidEl.value.trim() || 'participante';
    }

    function formatTime(ts) {
      return new Date(ts * 1000).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    function renderText(text) {
      // Extract URLs first to protect them from markdown processing.
      const urls = [];
      const withPlaceholders = text.replace(/(https?:\/\/[^\s]+)/g, (match) => {
        urls.push(match);
        return `\x00URL${urls.length - 1}\x00`;
      });

      const processed = withPlaceholders
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*(.*?)\*/g, '<strong>$1</strong>')
        .replace(/_(.*?)_/g, '<em>$1</em>');

      return processed.replace(/\x00URL(\d+)\x00/g, (_, i) => {
        const url = urls[parseInt(i, 10)];
        return `<a href="${url}" target="_blank">${url}</a>`;
      });
    }

    function addBubble(role, text, ts) {
      const div = document.createElement('div');
      div.className = `bubble ${role}`;
      div.innerHTML = `${renderText(text)}<div class="bubble-time">${formatTime(ts)}</div>`;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function syncMessages(msgs) {
      if (msgs.length <= lastCount) return;
      msgs.slice(lastCount).forEach(m => addBubble(m.role, m.text, m.ts));
      lastCount = msgs.length;
    }

    function startPolling(pid) {
      if (polling) clearInterval(polling);
      polling = setInterval(async () => {
        const r = await fetch(`/messages/${encodeURIComponent(pid)}`);
        const msgs = await r.json();
        syncMessages(msgs);
      }, 2000);
    }

    async function sendMessage() {
      const text = msgEl.value.trim();
      const pid  = participantId();
      if (!text) return;

      msgEl.value = '';
      addBubble('user', text, Date.now() / 1000);
      // Don't increment lastCount here — server echoes the user message back,
      // so we skip it by setting lastCount = length-1 after the response.

      typingEl.style.display = 'flex';
      messagesEl.scrollTop = messagesEl.scrollHeight;

      try {
        const r = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ participant_id: pid, text }),
        });
        const data = await r.json();
        typingEl.style.display = 'none';
        // Skip the echoed user message; show only the new agent reply.
        lastCount = Math.max(lastCount, data.messages.length - 1);
        syncMessages(data.messages);
        startPolling(pid);
      } catch {
        typingEl.style.display = 'none';
      }
    }

    // Start polling when participant_id changes
    pidEl.addEventListener('change', () => {
      lastCount = 1;
      messagesEl.innerHTML = `
        <div class="bubble agent">
          Olá! 👋 Sou o agente do Pipo Cuida.<br><br>
          Posso te ajudar a conectar sua conta do Strava ao Olimpipo.
          Tente enviar: <em>conectar strava</em>
          <div class="bubble-time">agora</div>
        </div>`;
      startPolling(pidEl.value.trim());
    });
  </script>
</body>
</html>
